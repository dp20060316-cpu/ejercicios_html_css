<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación CSS</title>

    <style>
        header {
            margin: 30px;
            padding: 15px;
            text-align: center;
            border: 1px solid;
            animation: minanimacion 1s ease-in-out 0s infinite normal none;
        }

        @keyframes minanimacion {
            20% {
                background: #FFFFFF;
            }

            35% {
                transform: scale(0.5);
                background: #FFFF00;
            }

            50% {
                transform: scale(1.5);
                background: #FF0000;
            }

            65% {
                transform: scale(0.5);
                background: #FFFFFF;
            }

            80% {
                background: #FFFFFF;
            }
        }

        #titulo {
            font: bold 26px Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <div id="titulo">Mi animación CSS</div>
    </header>

</body>
</html>
