<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealPhone | Dial de características</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="escena" id="escena">

    <div class="cuna"></div>

    <div class="anillo" id="anillo"></div>

    <img class="telefono" id="telefono" src="imagenes/mobile.png" alt="RealPhone">

    <header class="barra">
      <img class="logo" src="imagenes/logo.png" alt="RealPhone">
      <nav>
        <a href="#">Home</a>
        <a href="#">Phone</a>
        <a href="#">Accessories</a>
        <a href="#">Cart</a>
      </nav>
    </header>

    <div class="mando">
      <button class="flecha" id="btnArriba" aria-label="Característica anterior">
        <img src="imagenes/arrow.png" alt="">
      </button>
      <h3>Features</h3>
      <button class="flecha abajo" id="btnAbajo" aria-label="Característica siguiente">
        <img src="imagenes/arrow.png" alt="">
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
